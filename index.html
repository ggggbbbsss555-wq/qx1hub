<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>QXHub — Social</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-600-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-700-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-800-normal.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
*,*::before,*::after{scrollbar-width:thin;scrollbar-color:rgba(140,140,140,0.3) transparent}
*::-webkit-scrollbar{width:6px;height:6px;background:transparent}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:rgba(140,140,140,0.3);border-radius:10px}
*::-webkit-scrollbar-button{display:none}
html,body{width:100%;height:100%;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden;transition:background 0.25s ease,color 0.25s ease;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
:root{
  --bg:#000;--bg2:#0a0a0a;--bg3:#111;--bg4:#1a1a1a;
  --border:#1f1f1f;--border2:#2a2a2a;
  --text:#fff;--text2:#aaa;--text3:#888;--text4:#666;
  --accent:#00d2ff;--accent2:#0099cc;
  --like:#ff4466;--success:#00ff88;
  --hover:rgba(255,255,255,0.06);
  --grad-top:linear-gradient(180deg,#0d0d0d 0%,#000 100%);
  --avatar-grad:linear-gradient(135deg,#00d2ff 0%,#0099cc 100%);
  --brand-grad:linear-gradient(135deg,#fff 0%,#00d2ff 100%);
  --dot-border:#000;
  --sent-grad:linear-gradient(135deg,#00d2ff 0%,#0099cc 100%);
  --sent-text:#000;
  --overlay:rgba(0,0,0,0.6);
}
:root.light{
  --bg:#fff;--bg2:#fafafa;--bg3:#f5f5f5;--bg4:#e5e5e5;
  --border:#e5e5e5;--border2:#d5d5d5;
  --text:#000;--text2:#555;--text3:#777;--text4:#999;
  --accent:#0099cc;--accent2:#007aa3;
  --like:#e0245e;--success:#00b368;
  --hover:rgba(0,0,0,0.04);
  --grad-top:linear-gradient(180deg,#fafafa 0%,#fff 100%);
  --avatar-grad:linear-gradient(135deg,#0099cc 0%,#007aa3 100%);
  --brand-grad:linear-gradient(135deg,#000 0%,#0099cc 100%);
  --dot-border:#fff;
  --sent-grad:linear-gradient(135deg,#0099cc 0%,#007aa3 100%);
  --sent-text:#fff;
  --overlay:rgba(0,0,0,0.4);
}
body{background:var(--bg);color:var(--text)}
.app{width:100%;height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto;background:var(--bg);position:relative;overflow:hidden}

.top-bar{height:56px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--grad-top);border-bottom:1px solid var(--border);z-index:10}
.brand{font-size:20px;font-weight:800;letter-spacing:-0.3px;background:var(--brand-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;cursor:pointer;transition:opacity 0.2s ease}
.brand:active{opacity:0.6}
.top-actions{display:flex;align-items:center;gap:6px}
.icon-btn{width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;color:var(--text);cursor:pointer;border-radius:50%;position:relative;transition:background 0.15s ease,transform 0.1s ease}
.icon-btn:hover{background:var(--hover)}
.icon-btn:active{transform:scale(0.9);background:var(--hover)}
.icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dot-badge{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--like);border:2px solid var(--dot-border);display:none}
.dot-badge.visible{display:block;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}

.pages{flex:1;overflow:hidden;position:relative;min-height:0}
.page{position:absolute;top:0;left:0;width:100%;height:100%;overflow-y:auto;opacity:0;pointer-events:none;transition:opacity 0.2s ease,transform 0.2s ease;transform:translateX(20px);-webkit-overflow-scrolling:touch}
.page.active{opacity:1;pointer-events:auto;transform:translateX(0)}
.page-inner{max-width:640px;margin:0 auto;padding-bottom:20px}

.feed{padding-bottom:20px}
.post{border-bottom:1px solid var(--border);background:var(--bg);animation:slideIn 0.3s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.post.hidden{display:none}
.post-header{display:flex;align-items:center;gap:10px;padding:12px 16px}
.avatar{border-radius:50%;overflow:hidden;flex-shrink:0;background:var(--bg3);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;cursor:pointer;transition:transform 0.15s ease}
.avatar:active{transform:scale(0.92)}
.avatar-placeholder{width:100%;height:100%;background:var(--avatar-grad);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.post-avatar{width:36px;height:36px}
.post-avatar .avatar-placeholder{font-size:14px}
.post-user-info{flex:1;min-width:0;cursor:pointer}
.post-username{font-size:13px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:4px}
.post-username .verified{width:12px;height:12px;fill:var(--accent)}
.post-time{font-size:11px;color:var(--text4);margin-top:1px}
.post-menu-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;color:var(--text);cursor:pointer;border-radius:50%;transition:background 0.15s ease,transform 0.1s ease}
.post-menu-btn:hover{background:var(--hover)}
.post-menu-btn:active{transform:scale(0.85);background:var(--hover)}
.post-menu-btn svg{width:18px;height:18px;stroke:currentColor;fill:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.post-content{padding:0 16px 10px}
.post-text{font-size:14px;color:var(--text);line-height:1.5;word-wrap:break-word;white-space:pre-wrap}
.post-text .tag,.post-text .mention{color:var(--accent);font-weight:600;cursor:pointer}
.post-text .tag:active,.post-text .mention:active{opacity:0.6}
.post-image{width:100%;max-height:520px;object-fit:cover;display:block;background:var(--bg3);cursor:pointer;transition:opacity 0.2s ease}
.post-image:active{opacity:0.85}
.post-actions{display:flex;align-items:center;gap:4px;padding:10px 12px 6px}
.action-btn{display:flex;align-items:center;gap:5px;padding:6px 10px;background:transparent;border:none;color:var(--text);cursor:pointer;border-radius:8px;font-family:inherit;transition:background 0.15s ease,transform 0.1s ease}
.action-btn:hover{background:var(--hover)}
.action-btn:active{transform:scale(0.9)}
.action-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform 0.25s cubic-bezier(0.34,1.56,0.64,1)}
.action-btn .count{font-size:13px;font-weight:600;color:var(--text3)}
.action-btn.liked{color:var(--like)}
.action-btn.liked svg{fill:var(--like);stroke:var(--like)}
.action-btn.like-btn.just-liked svg{animation:likePop 0.4s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes likePop{0%{transform:scale(1)}30%{transform:scale(1.35)}60%{transform:scale(0.9)}100%{transform:scale(1)}}
.post-stats{padding:0 16px 4px;font-size:13px;font-weight:700;color:var(--text)}
.post-caption{padding:4px 16px 6px;font-size:13px;color:var(--text);line-height:1.45}
.post-caption .username{font-weight:700;margin-right:6px;cursor:pointer}
.view-comments-btn{padding:4px 16px 6px;font-size:13px;color:var(--text3);cursor:pointer;background:transparent;border:none;font-family:inherit;text-align:left;width:100%}
.view-comments-btn:hover{color:var(--text)}
.view-comments-btn:active{opacity:0.6}
.comments-section{padding:0 16px 10px;display:none}
.comments-section.open{display:block;animation:expandIn 0.25s ease}
@keyframes expandIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.comments-list{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.comment{font-size:13px;color:var(--text);line-height:1.4;display:flex;align-items:flex-start;gap:8px;animation:slideIn 0.25s ease}
.comment-avatar{width:24px;height:24px}
.comment-avatar .avatar-placeholder{font-size:10px}
.comment-body{flex:1;min-width:0}
.comment-username{font-weight:700;margin-right:6px;cursor:pointer}
.comment-text{word-wrap:break-word;color:var(--text2)}
.comment-time{font-size:11px;color:var(--text4);margin-top:2px}
.add-comment{display:flex;align-items:center;gap:8px;padding:8px 0 4px;border-top:1px solid var(--border)}
.add-comment input{flex:1;background:transparent;border:none;color:var(--text);font-family:inherit;font-size:13px;outline:none;padding:6px 0}
.add-comment input::placeholder{color:var(--text4)}
.post-comment-btn{background:transparent;border:none;color:var(--accent);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;opacity:0.5;transition:opacity 0.15s ease,transform 0.1s ease}
.post-comment-btn.active{opacity:1}
.post-comment-btn:active{transform:scale(0.92)}

.search-header{padding:14px 16px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--border)}
.search-input-wrap{position:relative}
.search-input-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--text4);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.search-input{width:100%;padding:10px 38px 10px 38px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:border-color 0.15s ease,background 0.15s ease}
.search-input:focus{border-color:var(--accent);background:var(--bg2)}
.search-input::placeholder{color:var(--text4)}
.search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:22px;height:22px;display:none;align-items:center;justify-content:center;background:var(--bg4);border:none;color:var(--text2);cursor:pointer;border-radius:50%;font-size:14px;line-height:1}
.search-clear.visible{display:flex}
.search-clear:active{transform:translateY(-50%) scale(0.85)}
.search-results{padding:10px 16px}
.search-result-item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:8px;cursor:pointer;transition:background 0.15s ease}
.search-result-item:hover{background:var(--hover)}
.search-result-item:active{background:var(--hover);transform:scale(0.99)}
.search-result-avatar{width:44px;height:44px}
.search-result-avatar .avatar-placeholder{font-size:16px}
.search-result-info{flex:1;min-width:0}
.search-result-name{font-size:14px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:4px}
.search-result-name .verified{width:11px;height:11px;fill:var(--accent)}
.search-result-bio{font-size:12px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-result-menu{width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;color:var(--text);cursor:pointer;border-radius:50%;flex-shrink:0;transition:background 0.15s ease,transform 0.1s ease}
.search-result-menu:hover{background:var(--hover)}
.search-result-menu:active{transform:scale(0.85)}
.search-result-menu svg{width:18px;height:18px;stroke:currentColor;fill:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.empty-state{text-align:center;padding:60px 20px;color:var(--text4)}
.empty-state svg{width:48px;height:48px;stroke:var(--text4);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;margin-bottom:12px;opacity:0.6}
.empty-state .title{font-size:15px;font-weight:600;color:var(--text3);margin-bottom:4px}
.empty-state .subtitle{font-size:13px;color:var(--text4)}

.messages-header{padding:16px;border-bottom:1px solid var(--border)}
.messages-title{font-size:20px;font-weight:800;color:var(--text);display:flex;align-items:center;gap:8px}
.new-badge{padding:2px 8px;border-radius:10px;background:rgba(0,210,255,0.1);color:var(--accent);font-size:11px;font-weight:700}
.conversation{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;transition:background 0.15s ease}
.conversation:hover{background:var(--hover)}
.conversation:active{background:var(--hover)}
.conv-avatar{width:52px;height:52px;position:relative}
.conv-avatar .avatar-placeholder{font-size:18px}
.online-dot{position:absolute;bottom:2px;right:2px;width:12px;height:12px;border-radius:50%;background:var(--success);border:2px solid var(--dot-border)}
.conv-info{flex:1;min-width:0}
.conv-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.conv-name{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-time{font-size:11px;color:var(--text4);flex-shrink:0}
.conv-preview{font-size:13px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-preview.unread{color:var(--text);font-weight:600}
.conv-unread{width:18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* ===== Chat Overlay — FIXED LAYOUT (header & input never move) ===== */
.chat-overlay{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  height:100dvh;
  background:var(--bg);
  z-index:200;
  display:flex;
  flex-direction:column;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.2s ease;
  overflow:hidden;
  overscroll-behavior:contain;
  touch-action:none;
}
.chat-overlay.visible{opacity:1;pointer-events:auto}

.chat-header{
  position:relative;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 12px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));
  border-bottom:1px solid var(--border);
  background:var(--bg);
  flex:0 0 auto;
  min-height:56px;
  z-index:5;
}
.chat-back{width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;color:var(--text);cursor:pointer;border-radius:50%;flex-shrink:0;transition:background 0.15s ease,transform 0.1s ease}
.chat-back:hover{background:var(--hover)}
.chat-back:active{transform:scale(0.9)}
.chat-back svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chat-user-info{flex:1;min-width:0;display:flex;align-items:center;gap:10px;overflow:hidden;cursor:pointer}
.chat-user-info:active{opacity:0.6}
.chat-user-avatar{width:36px;height:36px;flex-shrink:0}
.chat-user-avatar .avatar-placeholder{font-size:14px}
.chat-user-details{flex:1;min-width:0;overflow:hidden}
.chat-user-name{font-size:15px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-user-status{font-size:11px;margin-top:1px}
.chat-menu-btn{width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;color:var(--text);cursor:pointer;border-radius:50%;flex-shrink:0;transition:background 0.15s ease,transform 0.1s ease}
.chat-menu-btn:hover{background:var(--hover)}
.chat-menu-btn:active{transform:scale(0.85)}
.chat-menu-btn svg{width:20px;height:20px;stroke:currentColor;fill:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.chat-messages{
  flex:1 1 auto;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  padding:16px;
  padding-top:calc(16px + env(safe-area-inset-top,0px));
  display:flex;
  flex-direction:column;
  gap:8px;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  overscroll-behavior-y:contain;
  touch-action:pan-y;
}
.chat-message{
  max-width:78%;
  padding:9px 13px;
  border-radius:18px;
  font-size:14px;
  line-height:1.4;
  word-wrap:break-word;
  flex-shrink:0;
  animation:msgIn 0.25s ease;
}
@keyframes msgIn{from{opacity:0;transform:translateY(6px) scale(0.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.chat-message.sent{
  align-self:flex-end;
  background:var(--sent-grad);
  color:var(--sent-text);
  border-bottom-right-radius:4px;
}
.chat-message.received{
  align-self:flex-start;
  background:var(--bg3);
  color:var(--text);
  border-bottom-left-radius:4px;
}
.chat-message-time{font-size:10px;opacity:0.7;margin-top:3px}

.chat-input-area{
  position:relative;
  display:flex;
  align-items:flex-end;
  gap:8px;
  padding:10px 12px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--border);
  background:var(--bg);
  flex:0 0 auto;
  z-index:5;
}

.chat-input{
  flex:1;
  min-height:40px;
  max-height:120px;
  padding:10px 14px;
  background:var(--bg3);
  border:1px solid var(--border);
  border-radius:20px;
  color:var(--text);
  font-family:inherit;
  font-size:15px;
  line-height:1.4;
  outline:none;
  resize:none;
  overflow-y:auto;
  word-wrap:break-word;
  word-break:break-word;
  -webkit-appearance:none;
}
.chat-input:focus{border-color:var(--accent)}
.chat-input::placeholder{color:var(--text4)}
.chat-send-btn{
  width:40px;height:40px;
  display:flex;align-items:center;justify-content:center;
  background:var(--sent-grad);
  border:none;border-radius:50%;
  cursor:pointer;flex-shrink:0;
  align-self:flex-end;
  transition:transform 0.15s ease,opacity 0.15s ease;
}
.chat-send-btn:active{transform:scale(0.88)}
.chat-send-btn:disabled{opacity:0.4;cursor:not-allowed}
.chat-send-btn svg{width:18px;height:18px;stroke:var(--sent-text);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}

/* ===== Profile ===== */
.profile-header{padding:20px 16px;border-bottom:1px solid var(--border)}
.profile-top-row{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.profile-back{width:32px;height:32px;display:none;align-items:center;justify-content:center;background:transparent;border:none;color:var(--text);cursor:pointer;border-radius:50%;flex-shrink:0;transition:background 0.15s ease,transform 0.1s ease}
.profile-back.visible{display:flex}
.profile-back:hover{background:var(--hover)}
.profile-back:active{transform:scale(0.85)}
.profile-back svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.profile-title{font-size:16px;font-weight:700;color:var(--text);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:none}
.profile-title.visible{display:block}
.profile-top{display:flex;align-items:center;gap:20px;margin-bottom:16px}
.profile-avatar{width:86px;height:86px;cursor:default}
.profile-avatar .avatar-placeholder{font-size:32px}
.profile-stats{display:flex;gap:20px;flex:1;justify-content:space-around}
.profile-stat{text-align:center;cursor:pointer;transition:transform 0.1s ease;padding:4px;border-radius:8px}
.profile-stat:active{transform:scale(0.92);background:var(--hover)}
.profile-stat-value{font-size:17px;font-weight:800;color:var(--text);line-height:1}
.profile-stat-label{font-size:12px;color:var(--text3);margin-top:4px}
.profile-name{font-size:15px;font-weight:700;color:var(--text);margin-bottom:2px}
.profile-bio{font-size:13px;color:var(--text2);line-height:1.45;margin-bottom:12px;white-space:pre-wrap}
.profile-actions{display:flex;gap:8px;align-items:center}
.profile-actions:empty{display:none}
.profile-btn{flex:1;padding:8px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:background 0.15s ease,transform 0.1s ease,opacity 0.15s ease;display:flex;align-items:center;justify-content:center;gap:6px;min-height:34px}
.profile-btn:hover{background:var(--bg4)}
.profile-btn:active{transform:scale(0.97)}
.profile-btn.primary{background:var(--sent-grad);border-color:var(--accent);color:var(--sent-text)}
.profile-btn.following{background:var(--bg3);color:var(--text);border-color:var(--border2)}
.profile-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.profile-menu-btn{width:34px;height:34px;flex:0 0 auto;display:none;align-items:center;justify-content:center;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);cursor:pointer;transition:background 0.15s ease,transform 0.1s ease}
.profile-menu-btn.visible{display:flex}
.profile-menu-btn:hover{background:var(--bg4)}
.profile-menu-btn:active{transform:scale(0.9)}
.profile-menu-btn svg{width:18px;height:18px;stroke:currentColor;fill:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.profile-tabs{display:flex;border-bottom:1px solid var(--border)}
.profile-tab{flex:1;padding:12px;background:transparent;border:none;color:var(--text4);cursor:pointer;display:flex;align-items:center;justify-content:center;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color 0.15s ease,border-color 0.15s ease}
.profile-tab:hover{color:var(--text2)}
.profile-tab:active{background:var(--hover)}
.profile-tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.profile-tab.active svg{stroke-width:2.2}
.profile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:2px}
.profile-tile{aspect-ratio:1;background:var(--bg3);overflow:hidden;cursor:pointer;position:relative;transition:opacity 0.15s ease}
.profile-tile:active{opacity:0.85}
.profile-tile img{width:100%;height:100%;object-fit:cover;display:block}
.profile-tile-empty{display:flex;align-items:center;justify-content:center;color:var(--text4);font-size:11px;font-weight:600}
.profile-tile-stats{position:absolute;bottom:6px;right:8px;color:#fff;font-size:11px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,0.8);display:flex;align-items:center;gap:3px}

/* ===== Create ===== */
.create-overlay{position:fixed;inset:0;width:100%;height:100%;height:100dvh;background:var(--bg);z-index:200;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity 0.2s ease,transform 0.2s ease;overflow:hidden;transform:translateY(20px)}
.create-overlay.visible{opacity:1;pointer-events:auto;transform:translateY(0)}
.create-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.create-title{font-size:16px;font-weight:700;color:var(--text)}
.create-cancel{background:transparent;border:none;color:var(--text);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:4px 8px;transition:opacity 0.15s ease}
.create-cancel:active{opacity:0.6}
.create-share{background:transparent;border:none;color:var(--accent);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;padding:4px 8px;opacity:0.5;transition:opacity 0.15s ease,transform 0.1s ease}
.create-share.active{opacity:1}
.create-share.active:active{transform:scale(0.92)}
.create-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;min-height:0}
.create-user{display:flex;align-items:center;gap:10px}
.create-user-avatar{width:36px;height:36px}
.create-user-avatar .avatar-placeholder{font-size:14px}
.create-user-name{font-size:14px;font-weight:700;color:var(--text)}
.create-user-privacy{font-size:11px;color:var(--text4);display:flex;align-items:center;gap:4px}
.create-user-privacy svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.create-textarea{width:100%;min-height:140px;background:transparent;border:none;color:var(--text);font-family:inherit;font-size:15px;line-height:1.5;outline:none;resize:none}
.create-textarea::placeholder{color:var(--text4)}
.create-image-preview{position:relative;width:100%;border-radius:12px;overflow:hidden;background:var(--bg3);display:none}
.create-image-preview.visible{display:block;animation:expandIn 0.25s ease}
.create-image-preview img{width:100%;display:block;max-height:360px;object-fit:cover}
.create-image-remove{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,0.7);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform 0.1s ease}
.create-image-remove:active{transform:scale(0.88)}
.create-image-remove svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.create-footer{padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0}
.create-tool{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;color:var(--text);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:background 0.15s ease,transform 0.1s ease}
.create-tool:hover{background:var(--bg4)}
.create-tool:active{transform:scale(0.95)}

/* ===== Notifications ===== */
.notif-overlay{position:fixed;inset:0;width:100%;height:100%;height:100dvh;background:var(--bg);z-index:200;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity 0.2s ease,transform 0.2s ease;overflow:hidden;transform:translateY(20px)}
.notif-overlay.visible{opacity:1;pointer-events:auto;transform:translateY(0)}
.notif-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.notif-title{font-size:18px;font-weight:800;color:var(--text)}
.notif-list{flex:1;overflow-y:auto;padding:8px 0;min-height:0}
.notif-section-title{padding:12px 16px 6px;font-size:13px;font-weight:700;color:var(--text)}
.notif-item{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;transition:background 0.15s ease}
.notif-item:hover{background:var(--hover)}
.notif-item:active{background:var(--hover)}
.notif-item.unread{background:rgba(0,210,255,0.08)}
.notif-avatar{width:42px;height:42px;flex-shrink:0}
.notif-avatar .avatar-placeholder{font-size:15px}
.notif-content{flex:1;min-width:0}
.notif-text{font-size:13px;color:var(--text);line-height:1.4}
.notif-text .username{font-weight:700}
.notif-text .time{color:var(--text4);margin-left:4px}
.notif-thumb{width:40px;height:40px;border-radius:6px;background:var(--bg3);overflow:hidden;flex-shrink:0}
.notif-thumb img{width:100%;height:100%;object-fit:cover;display:block}

/* ===== Bottom Bar ===== */
.bottom-bar{height:56px;height:calc(56px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);flex-shrink:0;display:flex;align-items:center;justify-content:space-around;background:var(--grad-top);border-top:1px solid var(--border);z-index:20;padding-left:8px;padding-right:8px}
.nav-btn{flex:1;display:flex;align-items:center;justify-content:center;height:56px;background:transparent;border:none;color:var(--text);cursor:pointer;position:relative;padding:0;transition:transform 0.1s ease,color 0.15s ease}
.nav-btn:active{transform:scale(0.88)}
.nav-btn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:stroke-width 0.15s ease}
.nav-btn.active svg{stroke-width:2.2}
.nav-btn .badge{position:absolute;top:8px;right:calc(50% - 18px);min-width:16px;height:16px;padding:0 4px;background:var(--like);color:#fff;font-size:9px;font-weight:700;border-radius:8px;display:flex;align-items:center;justify-content:center}
.nav-btn .badge.hidden{display:none}
.nav-btn.create-btn{flex:0 0 auto;width:44px;height:44px;margin:0 4px;background:var(--sent-grad);color:var(--sent-text);border-radius:12px;transition:transform 0.1s ease}
.nav-btn.create-btn:active{transform:scale(0.9)}
.nav-btn.create-btn svg{width:24px;height:24px;stroke:currentColor;stroke-width:2.5}
.nav-btn.profile-nav{padding:0}
.nav-btn.profile-nav .nav-avatar{width:26px;height:26px;border-radius:50%;overflow:hidden;border:2px solid transparent;transition:border-color 0.15s ease}
.nav-btn.profile-nav.active .nav-avatar{border-color:var(--text)}
.nav-btn.profile-nav .nav-avatar .avatar-placeholder{font-size:11px}

/* ===== Toast ===== */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);padding:10px 18px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:12px;font-weight:600;opacity:0;pointer-events:none;transition:all 0.25s ease;z-index:300;max-width:90%;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,0.3)}
#toast.visible{opacity:1;transform:translateX(-50%) translateY(0)}

/* ===== Action Sheet (for 3-dots menus) ===== */
.sheet-overlay{position:fixed;inset:0;background:var(--overlay);z-index:250;opacity:0;pointer-events:none;transition:opacity 0.2s ease}
.sheet-overlay.visible{opacity:1;pointer-events:auto}
.action-sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg2);border-radius:16px 16px 0 0;border-top:1px solid var(--border);z-index:251;transform:translateY(100%);transition:transform 0.25s cubic-bezier(0.32,0.72,0,1);max-height:80vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -4px 24px rgba(0,0,0,0.3)}
.action-sheet.visible{transform:translateY(0)}
.action-sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--border2);margin:8px auto 4px;flex-shrink:0}
.action-sheet-title{padding:8px 16px 12px;font-size:13px;font-weight:600;color:var(--text3);text-align:center;border-bottom:1px solid var(--border);flex-shrink:0}
.action-sheet-list{flex:1;overflow-y:auto;padding:4px 0}
.action-sheet-item{display:flex;align-items:center;gap:14px;padding:14px 20px;background:transparent;border:none;color:var(--text);font-family:inherit;font-size:15px;font-weight:500;cursor:pointer;width:100%;text-align:left;transition:background 0.15s ease}
.action-sheet-item:hover{background:var(--hover)}
.action-sheet-item:active{background:var(--hover)}
.action-sheet-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;color:var(--text2)}
.action-sheet-item.danger{color:var(--like)}
.action-sheet-item.danger svg{color:var(--like)}
.action-sheet-item .check{margin-left:auto;color:var(--accent);width:18px;height:18px;stroke-width:2.5}
.action-sheet-cancel{margin:8px 16px 12px;padding:14px;background:var(--bg3);border:1px solid var(--border);border-radius:12px;color:var(--text);font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;text-align:center;transition:background 0.15s ease,transform 0.1s ease}
.action-sheet-cancel:hover{background:var(--bg4)}
.action-sheet-cancel:active{transform:scale(0.97)}

/* ===== Pull to refresh ===== */
.pull-indicator{position:absolute;top:0;left:50%;transform:translateX(-50%) translateY(-40px);width:32px;height:32px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;z-index:5;transition:transform 0.2s ease,opacity 0.2s ease;opacity:0;pointer-events:none}
.pull-indicator.visible{opacity:1}
.pull-indicator svg{width:18px;height:18px;stroke:var(--text2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform 0.2s ease}
.pull-indicator.spinning svg{animation:spin 0.8s linear infinite}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* ===== Post Detail Overlay ===== */
.detail-overlay{position:fixed;inset:0;width:100%;height:100%;height:100dvh;background:var(--bg);z-index:200;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity 0.2s ease,transform 0.2s ease;overflow:hidden;transform:translateY(20px)}
.detail-overlay.visible{opacity:1;pointer-events:auto;transform:translateY(0)}
.detail-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.detail-back{display:flex;align-items:center;justify-content:center;background:transparent;border:none;color:var(--text);cursor:pointer;border-radius:50%;width:32px;height:32px;transition:background 0.15s ease,transform 0.1s ease}
.detail-back:hover{background:var(--hover)}
.detail-back:active{transform:scale(0.9)}
.detail-back svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.detail-title{font-size:15px;font-weight:700;color:var(--text)}
.detail-body{flex:1;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch}

@media (max-width:480px){.profile-avatar{width:76px;height:76px}}
</style>
</head>

   STATE
   ============================================================ */
const S={
  theme:'dark',
  posts:[],
  pid:0,
  nid:0,
  convs:[],
  notifs:[],
  chat:null,

function mkChart(c){
  const cols={g:{bg:'#0a1a1a',l:'#00ff88',f:'rgba(0,255,136,0.1)'},p:{bg:'#1a0a1a',l:'#ab82ff',f:'rgba(171,130,255,0.1)'},b:{bg:'#0a1a2a',l:'#00d2ff',f:'rgba(0,210,255,0.1)'}};
  const cl=cols[c]||cols.g;
  const pts=[];let y=100;
  for(let i=0;i<30;i++){y+=(Math.random()-0.45)*15;y=Math.max(40,Math.min(160,y));pts.push({x:i*20+10,y});}
  const d=pts.map((p,i)=>(i?'L':'M')+p.x+' '+p.y).join(' ');
  const f=d+' L'+pts[29].x+' 200 L'+pts[0].x+' 200 Z';
  return 'data:image/svg+xml;base64,'+btoa('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" preserveAspectRatio="none"><rect width="600" height="200" fill="'+cl.bg+'"/><path d="'+f+'" fill="'+cl.f+'"/><path d="'+d+'" fill="none" stroke="'+cl.l+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>');
}

function buildPostHTML(p){
  const vSvg=p.u.v?'<svg class="verified" viewBox="0 0 24 24"><path d="M12 2l2.4 3.6 4.2-.6.6 4.2L22.8 12l-3.6 2.4.6 4.2-4.2.6L12 22l-2.4-3.6-4.2.6-.6-4.2L1.2 12l3.6-2.4-.6-4.2 4.2-.6z" fill="currentColor"/><polyline points="9 12 11 14 15 10" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>':'';
  const img=p.img&&IMG[p.img]?'<img class="post-image" src="'+IMG[p.img]+'" alt=""/>':'';
  const cap=p.cap?'<div class="post-caption"><span class="username" data-uid="'+p.u.id+'">'+esc(p.u.n)+'</span>'+esc(p.cap)+'</div>':'';
  const viewBtn=p.cmts.length>0?'<button class="view-comments-btn" data-pid="'+p.id+'">'+(p.co?'Hide comments':'View all '+p.cmts.length+' comments')+'</button>':'';
  return '<div class="post-header"><div class="avatar post-avatar" data-uid="'+p.u.id+'"><div class="avatar-placeholder">'+esc(p.u.i)+'</div></div><div class="post-user-info" data-uid="'+p.u.id+'"><div class="post-username">'+esc(p.u.n)+vSvg+'</div><div class="post-time">'+ago(p.t)+'</div></div><button class="post-menu-btn" data-pid="'+p.id+'"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg></button></div><div class="post-content"><div class="post-text">'+p.txt+'</div></div>'+img+'<div class="post-actions"><button class="action-btn like-btn'+(p.liked?' liked':'')+'" data-pid="'+p.id+'"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span class="count">'+fmt(p.likes)+'</span></button><button class="action-btn comment-btn" data-pid="'+p.id+'"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="count">'+p.cmts.length+'</span></button></div>'+cap+viewBtn+'<div class="comments-section'+(p.co?' open':'')+'" data-pid="'+p.id+'"><div class="comments-list" data-pid="'+p.id+'"></div><div class="add-comment"><input type="text" placeholder="Add a comment..." class="comment-input" data-pid="'+p.id+'"/><button class="post-comment-btn" data-pid="'+p.id+'">Post</button></div></div>';
}
function renderComments(pid){
  const p=S.posts.find(x=>x.id===pid);if(!p)return;
  const list=document.querySelector('.comments-list[data-pid="'+pid+'"]');if(!list)return;
  let html='';
  p.cmts.forEach(c=>{html+='<div class="comment"><div class="avatar comment-avatar" data-uid="'+c.u.id+'"><div class="avatar-placeholder">'+esc(c.u.i)+'</div></div><div class="comment-body"><span class="comment-username" data-uid="'+c.u.id+'">'+esc(c.u.n)+'</span><span class="comment-text">'+esc(c.txt)+'</span><div class="comment-time">'+ago(c.t)+'</div></div></div>';});
  list.innerHTML=html;
}
function renderFeed(){
  const feed=document.getElementById('feed');
  const frag=document.createDocumentFragment();
  S.posts.forEach(p=>{
    const art=document.createElement('article');
    art.className='post'+(S.hiddenPosts.has(p.id)?' hidden':'');
    art.dataset.pid=p.id;
    art.innerHTML=buildPostHTML(p);
    frag.appendChild(art);
  });
  feed.innerHTML='';feed.appendChild(frag);
  S.posts.forEach(p=>renderComments(p.id));
}

document.getElementById('feed').addEventListener('click',function(e){
  // Avatar or username → open profile
  const userEl=e.target.closest('[data-uid]');
  if(userEl&&!e.target.closest('.post-menu-btn')&&!e.target.closest('.action-btn')&&!e.target.closest('.view-comments-btn')&&!e.target.closest('.post-comment-btn')){
    const uid=parseInt(userEl.dataset.uid);
    if(uid>=0){openUserProfile(uid);return;}
  }
  // Post image → open detail
  if(e.target.classList.contains('post-image')){
    const post=e.target.closest('.post');
    if(post){openPostDetail(parseInt(post.dataset.pid));return;}
  }
  // Post 3-dots menu
  const menuBtn=e.target.closest('.post-menu-btn');
  if(menuBtn){
    const pid=parseInt(menuBtn.dataset.pid);
    showPostMenu(pid);
    return;
  }
  // Like
  const likeBtn=e.target.closest('.like-btn');
  if(likeBtn){
    const pid=parseInt(likeBtn.dataset.pid);
    const p=S.posts.find(x=>x.id===pid);if(!p)return;
    p.liked=!p.liked;p.likes+=p.liked?1:-1;
    likeBtn.classList.toggle('liked',p.liked);
    if(p.liked){likeBtn.classList.add('just-liked');vibrate(10);setTimeout(()=>likeBtn.classList.remove('just-liked'),450);}
    const cntEl=likeBtn.querySelector('.count');
    if(cntEl)cntEl.textContent=fmt(p.likes);
    return;
  }
  // Comment button
  const cmtBtn=e.target.closest('.comment-btn');
  if(cmtBtn){
    const pid=parseInt(cmtBtn.dataset.pid);
    const p=S.posts.find(x=>x.id===pid);if(!p)return;
    p.co=!p.co;
    const sec=cmtBtn.closest('.post').querySelector('.comments-section');
    sec.classList.toggle('open',p.co);
    const vb=cmtBtn.closest('.post').querySelector('.view-comments-btn');
    if(vb)vb.textContent=p.co?'Hide comments':'View all '+p.cmts.length+' comments';
    if(p.co){const inp=sec.querySelector('.comment-input');setTimeout(()=>inp.focus(),50);}
    return;
  }
  // View comments
  const vb=e.target.closest('.view-comments-btn');
  if(vb){
    const pid=parseInt(vb.dataset.pid);
    const p=S.posts.find(x=>x.id===pid);if(!p)return;
    p.co=!p.co;
    const sec=vb.closest('.post').querySelector('.comments-section');
    sec.classList.toggle('open',p.co);
    vb.textContent=p.co?'Hide comments':'View all '+p.cmts.length+' comments';
    if(p.co){const inp=sec.querySelector('.comment-input');setTimeout(()=>inp.focus(),50);}
    return;
  }
  // Post comment
  const pcb=e.target.closest('.post-comment-btn');
  if(pcb){submitComment(parseInt(pcb.dataset.pid));return;}
});
document.getElementById('feed').addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.classList.contains('comment-input'))submitComment(parseInt(e.target.dataset.pid));});
document.getElementById('feed').addEventListener('input',function(e){if(e.target.classList.contains('comment-input')){e.target.closest('.add-comment').querySelector('.post-comment-btn').classList.toggle('active',e.target.value.trim().length>0);}});
function submitComment(pid){
  const p=S.posts.find(x=>x.id===pid);if(!p)return;
  const inp=document.querySelector('.comment-input[data-pid="'+pid+'"]');
  const txt=inp.value.trim();if(!txt)return;
  p.cmts.push({u:ME,txt:txt,t:Date.now()});
  inp.value='';
  inp.closest('.add-comment').querySelector('.post-comment-btn').classList.remove('active');
  const post=inp.closest('.post');
  post.querySelector('.comment-btn .count').textContent=p.cmts.length;
  const vBtn=post.querySelector('.view-comments-btn');
  if(vBtn)vBtn.textContent='Hide comments';
  post.querySelector('.comments-section').classList.add('open');
  p.co=true;
  const list=post.querySelector('.comments-list');
  const div=document.createElement('div');
  div.className='comment';
  div.innerHTML='<div class="avatar comment-avatar" data-uid="0"><div class="avatar-placeholder">Y</div></div><div class="comment-body"><span class="comment-username" data-uid="0">You</span><span class="comment-text">'+esc(txt)+'</span><div class="comment-time">now</div></div>';
  list.appendChild(div);
  vibrate(8);
  showToast('Comment posted');
}

/* ============================================================
   MESSAGES / CONVERSATIONS
   ============================================================ */
function renderConvs(){
  const list=document.getElementById('conversations');
  const visible=S.convs.filter(c=>!S.blockedUsers.has(c.u.id));
  if(!visible.length){
    list.innerHTML='<div class="empty-state"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><div class="title">No messages yet</div><div class="subtitle">Start a conversation from Search</div></div>';
    const badge=document.getElementById('msgBadge');badge.classList.add('hidden');
    document.getElementById('msgNewBadge').textContent='0 new';
    return;
  }
  let html='',total=0;
  visible.forEach(c=>{
    total+=c.ur;
    html+='<div class="conversation" data-cid="'+c.id+'"><div class="avatar conv-avatar" data-uid="'+c.u.id+'"><div class="avatar-placeholder">'+esc(c.u.i)+'</div>'+(c.on?'<div class="online-dot"></div>':'')+'</div><div class="conv-info"><div class="conv-top"><div class="conv-name">'+esc(c.u.n)+'</div><div class="conv-time">'+c.tm+'</div></div><div class="conv-preview'+(c.ur>0?' unread':'')+'">'+esc(c.lm)+'</div></div>'+(c.ur>0?'<div class="conv-unread">'+c.ur+'</div>':'')+'</div>';
  });
  list.innerHTML=html;
  const badge=document.getElementById('msgBadge');
  if(total>0){badge.textContent=total;badge.classList.remove('hidden');}else badge.classList.add('hidden');
  document.getElementById('msgNewBadge').textContent=total+' new';
}
function updateConvDOM(cid){
  const c=S.convs.find(x=>x.id===cid);if(!c)return;
  const el=document.querySelector('.conversation[data-cid="'+cid+'"]');if(!el)return;
  el.querySelector('.conv-preview').textContent=c.lm;
  el.querySelector('.conv-preview').classList.toggle('unread',c.ur>0);
  el.querySelector('.conv-time').textContent=c.tm;
  const ub=el.querySelector('.conv-unread');
  if(c.ur>0){if(ub)ub.textContent=c.ur;else{const d=document.createElement('div');d.className='conv-unread';d.textContent=c.ur;el.appendChild(d);}}else if(ub)ub.remove();
}
document.getElementById('conversations').addEventListener('click',function(e){
  const avatar=e.target.closest('.conv-avatar');
  if(avatar){const uid=parseInt(avatar.dataset.uid);openUserProfile(uid);return;}
  const item=e.target.closest('.conversation');if(!item)return;
  const cid=parseInt(item.dataset.cid);
  const c=S.convs.find(x=>x.id===cid);if(c)openChat(c);
});

/* ============================================================
   CHAT
   ============================================================ */
const chatOverlay=document.getElementById('chatOverlay');
const chatMessages=document.getElementById('chatMessages');
const chatInput=document.getElementById('chatInput');
const chatSendBtn=document.getElementById('chatSendBtn');

function autoGrowTextarea(){
  chatInput.style.height='auto';
  const newH=Math.min(chatInput.scrollHeight,120);
  chatInput.style.height=newH+'px';
  chatSendBtn.disabled=chatInput.value.trim().length===0;
}
chatInput.addEventListener('input',autoGrowTextarea);

function startChatWithUser(uid){
  const u=userById(uid);if(!u)return;
  let c=S.convs.find(x=>x.u.id===uid);
  if(!c){c={id:Date.now(),u:u,lm:'Say hi!',tm:'now',ur:0,on:false};S.convs.unshift(c);S.chatMsgs[c.id]=[];renderConvs();}
  openChat(c);
}

function openChat(c){
  S.chat=c;c.ur=0;updateConvDOM(c.id);
  let total=0;S.convs.forEach(x=>total+=x.ur);
  const badge=document.getElementById('msgBadge');
  if(total>0){badge.textContent=total;badge.classList.remove('hidden');}else badge.classList.add('hidden');
  document.getElementById('msgNewBadge').textContent=total+' new';
  document.getElementById('chatUserInitial').textContent=c.u.i;
  document.getElementById('chatUserName').textContent=c.u.n;
  const st=document.getElementById('chatUserStatus');
  st.textContent=c.on?'Online':'Offline';
  st.style.color=c.on?'var(--success)':'var(--text3)';
  chatInput.value='';
  autoGrowTextarea();
  renderChatMsgs();
  chatOverlay.classList.add('visible');
  // Lock body scroll to prevent chat-header from disappearing on mobile
  document.body.style.overflow='hidden';
  requestAnimationFrame(()=>{
    chatMessages.scrollTop=chatMessages.scrollHeight;
    setTimeout(()=>{chatInput.focus();},300);
  });
}
function closeChat(){
  chatOverlay.classList.remove('visible');
  chatInput.blur();
  chatInput.value='';
  autoGrowTextarea();
  S.chat=null;
  document.body.style.overflow='';
}
function renderChatMsgs(){
  if(!S.chat)return;
  const msgs=S.chatMsgs[S.chat.id]||[];
  let html='';
  msgs.forEach(m=>{html+='<div class="chat-message '+(m.s?'sent':'received')+'">'+esc(m.txt)+'<div class="chat-message-time">'+m.tm+'</div></div>';});
  chatMessages.innerHTML=html;
  requestAnimationFrame(()=>{chatMessages.scrollTop=chatMessages.scrollHeight;});
}
function appendChatMsg(m){
  const div=document.createElement('div');
  div.className='chat-message '+(m.s?'sent':'received');
  div.innerHTML=esc(m.txt)+'<div class="chat-message-time">'+m.tm+'</div>';
  chatMessages.appendChild(div);
  requestAnimationFrame(()=>{chatMessages.scrollTop=chatMessages.scrollHeight;});
}
document.getElementById('chatBack').addEventListener('click',closeChat);
document.getElementById('chatUserInfo').addEventListener('click',()=>{if(S.chat)openUserProfile(S.chat.u.id);});
document.getElementById('chatMenuBtn').addEventListener('click',()=>{
  if(!S.chat)return;
  const uid=S.chat.u.id;
  const isMuted=S.mutedUsers.has(uid);
  const isBlocked=S.blockedUsers.has(uid);
  showActionSheet(S.chat.u.n,[
    {icon:'<svg viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>',label:'Share profile',action:()=>{showToast('Profile link copied');}},
    {icon:'<svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',label:'Clear chat',action:()=>{clearChat();}},
    {icon:'<svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>',label:isMuted?'Unmute':'Mute',action:()=>{toggleMute(uid);}},
    {icon:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>',label:isBlocked?'Unblock':'Block',danger:true,action:()=>{toggleBlock(uid);}}
  ]);
});
function clearChat(){
  if(!S.chat)return;
  S.chatMsgs[S.chat.id]=[];
  S.chat.lm='Chat cleared';S.chat.tm='now';
  renderChatMsgs();updateConvDOM(S.chat.id);
  showToast('Chat cleared');
}
function sendMsg(){
  const txt=chatInput.value.trim();if(!txt||!S.chat)return;
  if(!S.chatMsgs[S.chat.id])S.chatMsgs[S.chat.id]=[];
  const tm=nowTime();
  const m={txt:txt,s:true,tm:tm};
  S.chatMsgs[S.chat.id].push(m);
  S.chat.lm='You: '+txt;S.chat.tm='now';
  chatInput.value='';
  autoGrowTextarea();
  vibrate(8);
  appendChatMsg(m);updateConvDOM(S.chat.id);
  const chatId=S.chat.id;
  const userId=S.chat.u.id;
  setTimeout(()=>{
    if(S.blockedUsers.has(userId))return;
    const replies=['Got it! 👍','Thanks','Interesting','Let me check','Good point!','🚀','I agree','Nice!','Will do!','Appreciate it'];
    const reply=replies[Math.floor(Math.random()*replies.length)];
    const rtm=nowTime();
    const rm={txt:reply,s:false,tm:rtm};
    if(!S.chatMsgs[chatId])S.chatMsgs[chatId]=[];
    S.chatMsgs[chatId].push(rm);
    const c=S.convs.find(x=>x.id===chatId);
    if(c){c.lm=reply;c.tm='now';}
    if(S.chat&&S.chat.id===chatId)appendChatMsg(rm);
    if(c)updateConvDOM(chatId);
  },1200+Math.random()*1500);
}
chatSendBtn.addEventListener('click',sendMsg);
chatInput.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey){
    e.preventDefault();
    sendMsg();
  }
});

/* ============================================================
   PROFILE (dynamic — own vs other user)
   ============================================================ */
function openUserProfile(uid){
  // Push current page to nav stack (only if not already in profile viewing someone)
  if(S.viewingUserId===null){
    S.navStack.push(S.currentPage);
  }
  S.viewingUserId=uid;
  renderProfile();
  navTo('profile');
}
function backFromProfile(){
  if(S.viewingUserId!==null){
    S.viewingUserId=null;
    renderProfile();
    const back=document.getElementById('profileBack');
    const title=document.getElementById('profileTitle');
    back.classList.remove('visible');
    title.classList.remove('visible');
    const prev=S.navStack.pop()||'home';
    navTo(prev);
  }
}
document.getElementById('profileBack').addEventListener('click',backFromProfile);

function renderProfile(){
  const viewing=S.viewingUserId!==null?userById(S.viewingUserId):ME;
  if(!viewing)return;
  const isOwn=S.viewingUserId===null;
  // Header
  document.getElementById('profileAvatarInitial').textContent=viewing.i;
  document.getElementById('profileName').textContent=viewing.n;
  document.getElementById('profileBio').innerHTML=esc(viewing.b).replace(/\n/g,'<br>');
  // Stats
  let postsCount, followersCount, followingCount;
  if(isOwn){
    postsCount=S.posts.filter(p=>p.u.id===0).length;
    followersCount=S.myFollowers;
    followingCount=S.myFollowing;
  }else{
    postsCount=S.posts.filter(p=>p.u.id===viewing.id).length;
    // Mock followers/following for other users
    followersCount=viewing.id*240+150;
    followingCount=viewing.id*30+50;
  }
  document.getElementById('profilePostsCount').textContent=fmt(postsCount);
  document.getElementById('profileFollowersCount').textContent=fmt(followersCount);
  document.getElementById('profileFollowingCount').textContent=fmt(followingCount);
  // Buttons
  const msgBtn=document.getElementById('profileMsgBtn');
  const followBtn=document.getElementById('profileFollowBtn');
  const menuBtn=document.getElementById('profileMenuBtn');
  const backBtn=document.getElementById('profileBack');
  const titleEl=document.getElementById('profileTitle');
  if(isOwn){
    // Own profile: no action buttons at all (no Message, no Follow, no Edit, no menu)
    msgBtn.style.display='none';
    followBtn.style.display='none';
    menuBtn.classList.remove('visible');
    backBtn.classList.remove('visible');
    titleEl.classList.remove('visible');
    // Hide the actions container entirely
    document.querySelector('.profile-actions').style.display='none';
  }else{
    // Other user profile: Message + Follow + 3-dots menu
    msgBtn.style.display='flex';
    msgBtn.querySelector('span').textContent='Message';
    followBtn.style.display='flex';
    const isFollowing=S.following.has(viewing.id);
    followBtn.querySelector('span').textContent=isFollowing?'Following':'Follow';
    followBtn.classList.toggle('following',isFollowing);
    followBtn.classList.toggle('primary',!isFollowing);
    menuBtn.classList.add('visible');
    backBtn.classList.add('visible');
    titleEl.classList.add('visible');
    titleEl.textContent=viewing.n;
    // Show the actions container
    document.querySelector('.profile-actions').style.display='flex';
  }
  // Grid
  const grid=document.getElementById('profileGrid');
  const userPosts=S.posts.filter(p=>p.u.id===viewing.id);
  if(!userPosts.length){
    grid.innerHTML='<div style="grid-column:1/-1"><div class="empty-state"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><div class="title">No posts yet</div><div class="subtitle">Posts shared will appear here</div></div></div>';
    return;
  }
  let html='';
  userPosts.forEach(p=>{
    const img=p.img&&IMG[p.img]?IMG[p.img]:'';
    const stats=p.cmts.length>0?'<div class="profile-tile-stats"><svg viewBox="0 0 24 24" style="width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>'+p.cmts.length+'</div>':'';
    html+='<div class="profile-tile" data-pid="'+p.id+'">'+(img?'<img src="'+img+'" alt=""/>':'<div class="profile-tile-empty">'+(p.txt?'📝':'')+'</div>')+stats+'</div>';
  });
  grid.innerHTML=html;
}
// Profile events
document.getElementById('profileGrid').addEventListener('click',function(e){

document.getElementById('profileFollowBtn').addEventListener('click',function(){

document.getElementById('profileMenuBtn').addEventListener('click',function(){
  if(S.viewingUserId===null)return;
  const uid=S.viewingUserId;
  const u=userById(uid);if(!u)return;
  const isMuted=S.mutedUsers.has(uid);
  const isBlocked=S.blockedUsers.has(uid);
  const isFollowing=S.following.has(uid);
  showActionSheet(u.n,[
    {icon:'<svg viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>',label:'Share profile',action:()=>{showToast('Profile link copied');}},
    {icon:'<svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>',label:isFollowing?'Unfollow':'Follow',action:()=>{toggleFollow(uid);}},
    {icon:'<svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>',label:isMuted?'Unmute':'Mute',action:()=>{toggleMute(uid);}},
    {icon:'<svg viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>',label:'Report user',danger:true,action:()=>{showToast('Report submitted');}},
    {icon:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>',label:isBlocked?'Unblock':'Block',danger:true,action:()=>{toggleBlock(uid);}}
  ]);
});

function toggleFollow(uid){
  if(uid===0){showToast('Cannot follow yourself');return;}
  if(S.following.has(uid)){
    S.following.delete(uid);
    showToast('Unfollowed');
  }else{
    S.following.add(uid);
    showToast('Following');
  }
  vibrate(8);
  // If currently viewing this user's profile, re-render to update button
  if(S.viewingUserId===uid)renderProfile();
}
function toggleMute(uid){
  if(S.mutedUsers.has(uid)){S.mutedUsers.delete(uid);showToast('Unmuted');}
  else{S.mutedUsers.add(uid);showToast('Muted');}
  if(S.viewingUserId===uid)renderProfile();
}
function toggleBlock(uid){
  if(S.blockedUsers.has(uid)){
    S.blockedUsers.delete(uid);
    showToast('Unblocked');
  }else{
    S.blockedUsers.add(uid);
    showToast('Blocked');
    // Close chat if open with this user
    if(S.chat&&S.chat.u.id===uid)closeChat();
  }
  if(S.viewingUserId===uid)renderProfile();
  renderConvs();
}

   NOTIFICATIONS
   ============================================================ */
function renderNotifs(){
  const list=document.getElementById('notifList');
  const ur=S.notifs.filter(n=>n.ur),rd=S.notifs.filter(n=>!n.ur);
  let html='';
  if(!S.notifs.length){
    html='<div class="empty-state"><svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><div class="title">No notifications</div><div class="subtitle">Your activity will appear here</div></div>';
    list.innerHTML=html;return;
  }
  if(ur.length){html+='<div class="notif-section-title">New</div>';ur.forEach(n=>{html+=notifHTML(n);});}
  if(rd.length){html+='<div class="notif-section-title">Earlier</div>';rd.forEach(n=>{html+=notifHTML(n);});}
  list.innerHTML=html;
}
function notifHTML(n){
  const th=n.th&&IMG[n.th]?'<div class="notif-thumb"><img src="'+IMG[n.th]+'" alt=""/></div>':'';
  return '<div class="notif-item'+(n.ur?' unread':'')+'" data-nid="'+n.id+'"><div class="avatar notif-avatar" data-uid="'+n.u.id+'"><div class="avatar-placeholder">'+esc(n.u.i)+'</div></div><div class="notif-content"><div class="notif-text"><span class="username">'+esc(n.u.n)+'</span> '+esc(n.txt)+' <span class="time">'+n.tm+'</span></div></div>'+th+'</div>';
}
function addNotif(opts){
  const id=++S.nid;
  S.notifs.unshift(Object.assign({id:id,u:opts.u||ME,txt:opts.txt,tm:'now',ur:true,th:opts.th||null,type:opts.type||'other',postId:opts.postId,userId:opts.userId},opts));
  updateNotifBadge();
}
function updateNotifBadge(){const ur=S.notifs.filter(n=>n.ur).length;const dot=document.getElementById('notifDot');if(ur>0)dot.classList.add('visible');else dot.classList.remove('visible');}
document.getElementById('notifBtn').addEventListener('click',function(){renderNotifs();document.getElementById('notifOverlay').classList.add('visible');});
document.getElementById('notifBack').addEventListener('click',function(){document.getElementById('notifOverlay').classList.remove('visible');});
document.getElementById('notifMarkRead').addEventListener('click',function(){S.notifs.forEach(n=>n.ur=false);updateNotifBadge();renderNotifs();showToast('All marked as read');});
document.getElementById('notifList').addEventListener('click',function(e){
  const avatar=e.target.closest('.notif-avatar');
  if(avatar){const uid=parseInt(avatar.dataset.uid);openUserProfile(uid);return;}
  const item=e.target.closest('.notif-item');if(!item)return;
  const nid=parseInt(item.dataset.nid);
  const n=S.notifs.find(x=>x.id===nid);
  if(!n)return;
  n.ur=false;updateNotifBadge();item.classList.remove('unread');
  // Navigate based on type
  if(n.type==='like'||n.type==='comment'||n.type==='mention'){
    if(n.postId){document.getElementById('notifOverlay').classList.remove('visible');openPostDetail(n.postId);}
    else if(n.userId){document.getElementById('notifOverlay').classList.remove('visible');openUserProfile(n.userId);}
  }else if(n.type==='follow'){
    if(n.userId){document.getElementById('notifOverlay').classList.remove('visible');openUserProfile(n.userId);}
  }
});

/* ============================================================

   ============================================================ */
function navTo(page){
  S.currentPage=page;
  document.querySelectorAll('.nav-btn[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const pageEl=document.getElementById(page+'Page');
  pageEl.classList.add('active');
  pageEl.scrollTop=0;
}
function goHomeNav(){
  S.viewingUserId=null;
  S.navStack=[];
  document.getElementById('profileBack').classList.remove('visible');
  document.getElementById('profileTitle').classList.remove('visible');
  renderProfile();
}
document.querySelectorAll('.nav-btn[data-page]').forEach(b=>b.addEventListener('click',function(){
  if(b.dataset.page==='profile')goHomeNav();
  navTo(b.dataset.page);
}));
document.getElementById('brandLogo').addEventListener('click',function(){navTo('home');});

/* ============================================================
   TOAST
   ============================================================ */
let toastTimer=null;
function showToast(msg){
  let t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('visible');
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{t.classList.remove('visible');},2000);
}

/* ============================================================
   ACTION SHEET (shared 3-dots menu)
   ============================================================ */
const sheetOverlay=document.getElementById('sheetOverlay');
const actionSheet=document.getElementById('actionSheet');
let sheetCloseHandler=null;
function showActionSheet(title,items){
  document.getElementById('sheetTitle').textContent=title;
  const list=document.getElementById('sheetList');
  list.innerHTML='';
  items.forEach(item=>{
    const btn=document.createElement('button');
    btn.className='action-sheet-item'+(item.danger?' danger':'');
    btn.innerHTML=item.icon+'<span>'+item.label+'</span>';
    btn.addEventListener('click',()=>{
      hideActionSheet();
      setTimeout(()=>{if(item.action)item.action();},150);
    });
    list.appendChild(btn);
  });
  sheetOverlay.classList.add('visible');
  actionSheet.classList.add('visible');
}
function hideActionSheet(){
  sheetOverlay.classList.remove('visible');
  actionSheet.classList.remove('visible');
}
document.getElementById('sheetCancel').addEventListener('click',hideActionSheet);
sheetOverlay.addEventListener('click',hideActionSheet);

/* ============================================================
   PULL TO REFRESH (on feed)
   ============================================================ */
const homePage=document.getElementById('homePage');
const pullIndicator=document.getElementById('pullIndicator');
let pullStartY=0,pullCurrentY=0,pulling=false,refreshing=false;
const PULL_THRESHOLD=70;
homePage.addEventListener('touchstart',function(e){
  if(homePage.scrollTop===0&&!refreshing){
    pullStartY=e.touches[0].clientY;
    pulling=true;
  }
},{passive:true});
homePage.addEventListener('touchmove',function(e){
  if(!pulling||refreshing)return;
  pullCurrentY=e.touches[0].clientY;
  const diff=pullCurrentY-pullStartY;
  if(diff>0){
    const pull=Math.min(diff*0.5,PULL_THRESHOLD+20);
    pullIndicator.style.transform='translateX(-50%) translateY('+(-40+pull)+'px)';
    pullIndicator.classList.toggle('visible',diff>10);
    pullIndicator.querySelector('svg').style.transform='rotate('+(diff/PULL_THRESHOLD*180)+'deg)';
  }
},{passive:true});
homePage.addEventListener('touchend',function(){
  if(!pulling)return;
  pulling=false;
  const diff=pullCurrentY-pullStartY;
  if(diff>=PULL_THRESHOLD&&!refreshing){
    refreshing=true;
    pullIndicator.classList.add('spinning');
    pullIndicator.style.transform='translateX(-50%) translateY(20px)';
    // Simulate refresh
    setTimeout(()=>{
      // Add a new mock post at top
      const newPost={id:++S.pid,u:U[Math.floor(Math.random()*U.length)],t:Date.now(),txt:'<span class="tag">#New</span> Fresh update just dropped! 🚀',img:['c1','c2','c3'][Math.floor(Math.random()*3)],likes:Math.floor(Math.random()*100),liked:false,cmts:[],cap:null,co:false};
      S.posts.unshift(newPost);
      const feed=document.getElementById('feed');
      const art=document.createElement('article');
      art.className='post';art.dataset.pid=newPost.id;art.innerHTML=buildPostHTML(newPost);
      renderComments(newPost.id);
      feed.insertBefore(art,feed.firstChild);
      refreshing=false;
      pullIndicator.classList.remove('spinning');
      pullIndicator.classList.remove('visible');
      pullIndicator.style.transform='translateX(-50%) translateY(-40px)';
      showToast('Feed updated');
    },900);
  }else{
    pullIndicator.classList.remove('visible');
    pullIndicator.style.transform='translateX(-50%) translateY(-40px)';
  }
  pullStartY=0;pullCurrentY=0;
},{passive:true});

/* ============================================================
   KEYBOARD / BACK BUTTON (browser back closes overlays)
   ============================================================ */
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if(actionSheet.classList.contains('visible')){hideActionSheet();return;}
    if(detailOverlay.classList.contains('visible')){detailOverlay.classList.remove('visible');return;}
    if(createOverlay.classList.contains('visible')){closeCreate();return;}
    if(document.getElementById('notifOverlay').classList.contains('visible')){document.getElementById('notifOverlay').classList.remove('visible');return;}
    if(chatOverlay.classList.contains('visible')){closeChat();return;}
    if(S.viewingUserId!==null){backFromProfile();return;}
  }
});
